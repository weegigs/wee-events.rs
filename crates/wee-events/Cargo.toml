[package]
name = "wee-events"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
readme.workspace = true
# TODO: set public repository/homepage/documentation URLs before publishing.

# Surpress so --save-baseline etc from criterion can be used
[lib]
bench = false

[features]
default = []
cbor = ["dep:ciborium"]
testing = ["dep:criterion", "dep:tokio", "dep:futures"]

[dependencies]
ciborium = { workspace = true, optional = true }
criterion = { version = "0.5", features = ["async_tokio"], optional = true }
dashmap = { workspace = true }
futures = { version = "0.3", optional = true }
parking_lot = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, optional = true }
ulid = { version = "1", features = ["serde"] }
wee-events-macros = { path = "../wee-events-macros" }

[dev-dependencies]
restate-sdk = "0.9"
wee-events = { path = ".", features = ["testing"] }
wee-events-restate = { path = "../wee-events-restate" }
tokio = { workspace = true }
trybuild = "1"

[[bench]]
name = "memory_store"
harness = false

[[bench]]
name = "fat_payload"
harness = false

[lints]
workspace = true
